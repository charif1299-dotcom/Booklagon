.box{background:#fff;border-radius:24px;padding:18px;box-shadow:0 4px 14px #0001}

svg text{font-family:inherit}

function render(){render0();if(hist.length)v.insertAdjacentHTML('afterbegin','<button class="chip" onclick="back()">← ย้อนกลับ</button>')}
function render0(){
$('#nav').innerHTML=T.map(t=>`<button class="${t[0]==page?'on':''}" onclick="go('${t[0]}','all')">${t[1]}</button>`).join('');
const ks=Object.keys(C);
if(page=='home'){
const ic=['👨‍👩‍👧','👩‍🏫','🏫','🧠','🏘️','🏢','📚','👨‍⚖️'];
v.innerHTML=`<div class="c"><h1>ใครเกี่ยวข้องกับการศึกษาของเรา?</h1><p class="mut" style="max-width:640px;margin:auto">การศึกษาของเด็กไม่ได้เกิดขึ้นจากคนเพียงคนเดียว แต่มีหลายคนที่ช่วยกันดูแล สนับสนุน และสร้างโอกาสให้เด็กได้เรียนรู้</p>
<div class="orbit"><div class="m" style="left:50%;top:50%">👧</div>${ic.map((e,i)=>{const[x,y]=pos(8,i,40,50,50);return`<div class="o" style="left:${x}%;top:${y}%">${e}</div>`}).join('')}</div>
<button class="btn" onclick="go('over')">เริ่มสำรวจ</button></div>`}
else if(page=='over'){
const g=[['family','👨‍👩‍👧','ครอบครัว','ผู้ปกครอง / พ่อ / แม่ / ผู้ดูแลเด็ก'],['teacher','🧑‍🏫','ครูและผู้สอน','ครูปฐมวัย / ครูประจำชั้น / ครูประจำวิชา / ครูแนะแนว'],['school','🏫','โรงเรียน','ผู้อำนวยการ / รองผู้อำนวยการ / บุคลากรสนับสนุน'],['support','🔎','ผู้สนับสนุนการศึกษา','ศึกษานิเทศก์ / นักวิชาการศึกษา / นักจิตวิทยา / นักสังคมสงเคราะห์'],['local','🏘️','ท้องถิ่นและชุมชน','ผู้นำชุมชน / นายก อปท. / บุคลากรการศึกษาท้องถิ่น / ปราชญ์ชาวบ้าน'],['expert','🎓','นักวิชาการและผู้กำกับดูแล','นักวิจัย / ผู้เชี่ยวชาญ / ผู้บริหารการศึกษา / ผู้กำหนดนโยบาย']];
v.innerHTML=`<div class="c"><h2>เด็กหนึ่งคน มีใครช่วยดูแลบ้าง?</h2><p class="mut">กดที่กลุ่มเพื่อดูว่ามีใครอยู่ในกลุ่มนี้</p><div style="font-size:70px">👧</div><div class="mut">เด็ก</div></div>
<div class="grid">${g.map(x=>`<button class="card" style="--bg:${C[x[0]].c}" onclick="go('people','${x[0]}')"><div class="ic">${x[1]}</div><b>${x[2]}</b><small>${x[3]}</small><u>ดูรายละเอียด →</u></button>`).join('')}</div>`}
else if(page=='people'){
const L=P.filter(p=>(flt=='all'||p.k==flt||(flt=='expert'&&p.k=='regulator'&&0))&&(!q||(p.n+C[p.k].n).includes(q)));
const ch=[['all','ทั้งหมด']].concat(ks.map(k=>[k,C[k].n.split('และ')[0].replace('ผู้เรียน','ครอบครัว')]));
v.innerHTML=`<h2>👥 บุคคลที่เกี่ยวข้อง</h2><input id="q" placeholder="🔍 ค้นหาบุคคล เช่น “ครู” “ผู้ปกครอง” “นักจิตวิทยา”" value="${q}" oninput="q=this.value;lim=24;list()">
<div class="chips">${ch.map(c=>`<button class="chip ${flt==c[0]?'on':''}" style="--bg:${c[0]=='all'?'#e5e9f2':C[c[0]].c}" onclick="flt='${c[0]}';lim=24;render()">${c[1]}</button>`).join('')}</div><div id="ls"></div>`;list()}
else{v.innerHTML=`<div class="box" style="max-width:720px;margin:auto"><h2>ℹ️ เกี่ยวกับเนื้อหา</h2><p>เว็บไซต์นี้ใช้เป็นสื่อประกอบการสอน ไม่มีเกม คะแนน หรือแบบทดสอบ ครูสามารถเปิดฉายบนจอหรือ Interactive Board เพื่อให้นักเรียนสำรวจร่วมกันได้</p><p>เมื่อดูจบ ควรเข้าใจว่า <b>การศึกษาไม่ได้เกิดขึ้นจากครูเพียงคนเดียว</b> แต่เกิดจากเด็ก ครอบครัว ครู โรงเรียน ผู้เชี่ยวชาญ ชุมชน ท้องถิ่น และผู้กำกับดูแลทำงานร่วมกัน</p><p>คำถามชวนคิด: คนนี้ทำอะไร? เขาทำงานร่วมกับใคร? เขาช่วยเด็กอย่างไร?</p><p class="mut">หมายเหตุ: รายละเอียดของบุคคลส่วนใหญ่เป็นคำอธิบายระดับกลุ่ม ครูควรตรวจสอบและเพิ่มเติมให้ตรงกับบริบทจริง</p></div>`}}
function list(){const L=P.filter(p=>(flt=='all'||p.k==flt)&&(!q||(p.n+C[p.k].n).includes(q)));
$('#ls').innerHTML=`<div class="mut">พบ ${L.length} รายการ</div><div class="grid">${L.slice(0,lim).map(p=>`<button class="card" style="--bg:${C[p.k].c}" onclick="open_(${p.id})"><div class="ic">${p.ic}</div><b>${p.n}</b><small>${C[p.k].s}</small><u>ดูรายละเอียด →</u></button>`).join('')}</div>${L.length>lim?`<button class="btn more" onclick="lim+=24;list()">ดูเพิ่ม</button>`:''}`}
function open_(id){const p=P[id],f=info(p),c=C[p.k],W=f.w.slice(0,5);
$('#sh').innerHTML=`<button class="chip" onclick="cl()">← ย้อนกลับ</button><button class="x" onclick="cl()" aria-label="ปิด">✕</button><div class="c" style="background:${c.c};border-radius:20px;padding:18px"><div style="font-size:64px">${p.ic}</div><h2>${p.n}</h2><div>${f.d}</div></div>
<div class="sec" style="--bg:#fff8dc"><h3>① ⭐ บทบาทสำคัญ</h3><b>เขาทำอะไร?</b><div>${f.r}</div></div>
<div class="sec" style="--bg:#eef6ff"><h3>② 🤝 ทำงานร่วมกับใคร?</h3><svg viewBox="0 0 400 300" width="100%">${W.map((w,i)=>{const[x,y]=pos(W.length,i,105,200,150);return`<line x1="200" y1="150" x2="${x}" y2="${y}" stroke="#aebbd6" stroke-width="2"/><circle cx="${x}" cy="${y}" r="26" fill="#fff" stroke="#c7d3ea"/><text x="${x}" y="${y+10}" text-anchor="middle" font-size="26">${w[0]}</text><text x="${x}" y="${y+44}" text-anchor="middle" font-size="12" fill="#26324a">${w[1]}</text>`}).join('')}<circle cx="200" cy="150" r="34" fill="${c.c}" stroke="#26324a44"/><text x="200" y="164" text-anchor="middle" font-size="38">${p.ic}</text></svg><ul>${W.map(w=>`<li>${w[0]} ${w[1]} — ${w[2]}</li>`).join('')}</ul></div>
<div class="sec" style="--bg:#ffeef0"><h3>③ ❤️ ช่วยเด็กได้อย่างไร?</h3><ul>${f.h.map(x=>`<li>${x}</li>`).join('')}</ul></div>`;$('#md').classList.add('show')}
function cl(){$('#md').classList.remove('show')}
$('#md').onclick=e=>{if(e.target.id=='md')cl()};
render();
</script></body></html>
